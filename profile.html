<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — FITNEXA AI</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#02050A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body">
    <div id="appNavMount"></div>
    <main class="app-main">
        <div class="container-fluid px-3 px-lg-4 py-4">
            <h1 class="page-title">Your Profile</h1>
            <p class="page-subtitle mb-4">Manage your fitness identity and training preferences.</p>

            <div class="row g-4">
                <!-- User Info -->
                <div class="col-12 col-lg-4">
                    <div class="dash-card tilt-card glass-card-3d text-center py-4">
                        <img id="profileAvatar" src="images/hero-athlete.webp" alt="Avatar" class="profile-avatar">
                        <h3 class="profile-name mt-3" id="profileName">User Name</h3>
                        <p class="text-muted" id="profileEmail">email@email.com</p>
                        <div class="profile-badge" id="profileTier">Pro AI Member</div>
                        <div class="text-label mt-3" style="color:var(--text-dim);">Member since <span id="profileSince">January 2026</span></div>
                    </div>
                </div>

                <!-- Profile Settings -->
                <div class="col-12 col-lg-8">
                    <div class="dash-card tilt-card glass-card-3d">
                        <div class="dash-card-header">
                            <span class="text-label" style="color:var(--blue-accent);">FITNESS PROFILE</span>
                        </div>
                        <form id="profileForm" class="profile-form">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Full Name</label>
                                    <input type="text" id="pfName" class="form-input-custom" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Email</label>
                                    <input type="email" id="pfEmail" class="form-input-custom" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Fitness Goal</label>
                                    <select id="pfGoal" class="form-input-custom">
                                        <option>Build Muscle</option><option>Lose Fat</option><option>Build Strength</option>
                                        <option>Improve Endurance</option><option>Improve Fitness</option><option>Improve Mobility</option>
                                        <option>Maintain Fitness</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Fitness Level</label>
                                    <select id="pfLevel" class="form-input-custom">
                                        <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Training Days / Week</label>
                                    <select id="pfDays" class="form-input-custom">
                                        <option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Session Duration</label>
                                    <select id="pfDuration" class="form-input-custom">
                                        <option>15–20 minutes</option><option>30 minutes</option><option>45 minutes</option><option>60 minutes</option><option>90+ minutes</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Environment</label>
                                    <select id="pfEnv" class="form-input-custom">
                                        <option>Home</option><option>Gym</option><option>Outdoor</option><option>Mixed</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label-custom">Equipment</label>
                                    <input type="text" id="pfEquipment" class="form-input-custom" placeholder="Full gym, Dumbbells">
                                </div>
                                <div class="col-12">
                                    <label class="form-label-custom">Additional Notes</label>
                                    <textarea id="pfNotes" class="form-input-custom" rows="3" placeholder="Any preferences, injuries, or focus areas..."></textarea>
                                </div>
                            </div>
                            <div class="d-flex gap-3 mt-4">
                                <button type="submit" class="btn-primary-glow" style="padding:12px 32px;">
                                    SAVE CHANGES <span class="btn-arrow"><i class="bi bi-check-lg"></i></span>
                                </button>
                            </div>
                            <div id="saveMsg" class="auth-success mt-3" style="display:none;">
                                <i class="bi bi-check-circle-fill me-2"></i> Profile updated successfully.
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data-store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/motion-fx.js"></script>
    <script>
    (function() {
        'use strict';
        window.App.init();
        const user = window.Auth.getCurrentUser();
        if (!user) return;

        // Populate
        document.getElementById('profileAvatar').src = user.avatar;
        document.getElementById('profileName').textContent = user.fullName;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profileTier').textContent = user.planTier;
        document.getElementById('profileSince').textContent = user.memberSince;

        document.getElementById('pfName').value = user.fullName;
        document.getElementById('pfEmail').value = user.email;
        document.getElementById('pfGoal').value = user.profile.fitnessGoal;
        document.getElementById('pfLevel').value = user.profile.fitnessLevel;
        document.getElementById('pfDays').value = user.profile.trainingDays;
        document.getElementById('pfDuration').value = user.profile.sessionDuration;
        document.getElementById('pfEnv').value = user.profile.environment;
        document.getElementById('pfEquipment').value = (user.profile.equipment || []).join(', ');
        document.getElementById('pfNotes').value = user.profile.additionalNotes || '';

        // Save
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const updates = {
                fullName: document.getElementById('pfName').value.trim(),
                email: document.getElementById('pfEmail').value.trim()
            };
            window.DataStore.updateUser(user.id, updates);
            window.DataStore.updateUserProfile(user.id, {
                fitnessGoal: document.getElementById('pfGoal').value,
                fitnessLevel: document.getElementById('pfLevel').value,
                trainingDays: parseInt(document.getElementById('pfDays').value, 10),
                sessionDuration: document.getElementById('pfDuration').value,
                environment: document.getElementById('pfEnv').value,
                equipment: document.getElementById('pfEquipment').value.split(',').map(function(s) { return s.trim(); }),
                additionalNotes: document.getElementById('pfNotes').value.trim()
            });

            const msg = document.getElementById('saveMsg');
            msg.style.display = 'block';
            setTimeout(function() { msg.style.display = 'none'; }, 3000);
        });

        if (window.MotionFX) window.MotionFX.initTilt();
    })();
    </script>
</body>
</html>
