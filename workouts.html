<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workouts — FITNEXA AI</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#02050A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body">
    <div id="appNavMount"></div>
    <main class="app-main">
        <div class="container-fluid px-3 px-lg-4 py-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h1 class="page-title">Workout Library</h1>
                    <p class="page-subtitle">Personalized programs designed for your goals.</p>
                </div>
                <div class="search-container">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="searchInput" class="form-input-custom" placeholder="Search workouts..." style="padding-left:36px;">
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar mb-4" id="filterBar">
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="Strength">Strength</button>
                <button class="filter-pill" data-filter="Muscle Building">Muscle</button>
                <button class="filter-pill" data-filter="Fat Loss">Fat Loss</button>
                <button class="filter-pill" data-filter="HIIT">HIIT</button>
                <button class="filter-pill" data-filter="Endurance">Endurance</button>
                <button class="filter-pill" data-filter="Mobility">Mobility</button>
                <button class="filter-pill" data-filter="Recovery">Recovery</button>
            </div>

            <!-- Workout Grid -->
            <div class="row g-4" id="workoutGrid"></div>
        </div>
    </main>

    <script src="js/data-store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/motion-fx.js"></script>
    <script src="js/app-motion.js"></script>
    <script>
    (function() {
        'use strict';
        window.App.init();
        const workouts = window.DataStore.getWorkouts();
        const grid = document.getElementById('workoutGrid');
        const searchInput = document.getElementById('searchInput');
        let activeFilter = 'all';

        function renderWorkouts(filter, search) {
            let filtered = workouts;
            if (filter && filter !== 'all') {
                filtered = filtered.filter(function(w) { return w.category === filter; });
            }
            if (search) {
                const s = search.toLowerCase();
                filtered = filtered.filter(function(w) {
                    return w.name.toLowerCase().includes(s) || w.category.toLowerCase().includes(s) || w.difficulty.toLowerCase().includes(s);
                });
            }
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">No workouts found matching your criteria.</p></div>';
                return;
            }
            grid.innerHTML = filtered.map(function(w) {
                return '<div class="col-12 col-sm-6 col-lg-4 col-xl-3">' +
                    '<a href="workout-detail.html?id=' + w.id + '" class="workout-lib-card tilt-card glass-card-3d">' +
                        '<div class="wlc-image"><img src="' + w.image + '" alt="' + w.name + '" loading="lazy"></div>' +
                        '<div class="wlc-body">' +
                            '<div class="wlc-category">' + w.category + '</div>' +
                            '<h3 class="wlc-name">' + w.name + '</h3>' +
                            '<div class="wlc-meta">' +
                                '<span><i class="bi bi-clock me-1"></i>' + w.duration + ' min</span>' +
                                '<span><i class="bi bi-speedometer2 me-1"></i>' + w.difficulty + '</span>' +
                            '</div>' +
                            '<div class="wlc-meta">' +
                                '<span><i class="bi bi-list-ol me-1"></i>' + w.exercises.length + ' exercises</span>' +
                                '<span><i class="bi bi-fire me-1"></i>' + w.calories + ' cal</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="wlc-action">START <i class="bi bi-arrow-right"></i></div>' +
                    '</a>' +
                '</div>';
            }).join('');

            if (window.MotionFX) window.MotionFX.initTilt();
            if (window.AppMotion) window.AppMotion.staggerCards(grid.querySelectorAll('.workout-lib-card'));
        }

        // Filter clicks
        document.querySelectorAll('.filter-pill').forEach(function(pill) {
            pill.addEventListener('click', function() {
                document.querySelectorAll('.filter-pill').forEach(function(p) { p.classList.remove('active'); });
                this.classList.add('active');
                activeFilter = this.getAttribute('data-filter');
                renderWorkouts(activeFilter, searchInput.value);
            });
        });

        // Search
        searchInput.addEventListener('input', function() {
            renderWorkouts(activeFilter, this.value);
        });

        renderWorkouts('all', '');
    })();
    </script>
</body>
</html>
