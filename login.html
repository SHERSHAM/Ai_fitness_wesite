<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FITNEXA AI</title>
  <meta name="description" content="Log in to your FITNEXA AI personal training command center.">
  <meta name="theme-color" content="#0B0C0E">

  <!-- Google Fonts: Outfit, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- FITNEXA Stylesheets -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
</head>
<body>

  <div class="auth-split-wrapper">
    <!-- ==========================================================================
         LEFT FORM PANEL
         ========================================================================== -->
    <div class="auth-form-column">
      <!-- Brand Logo Header -->
      <a href="index.html" class="auth-brand-nav">
        <div>
          <div class="auth-brand-title">FITNEXA<span class="text-lime">.</span></div>
          <div class="auth-brand-tagline">Train Smarter. Be Stronger.</div>
        </div>
      </a>

      <!-- Form Container -->
      <div class="auth-form-container">
        <h1 class="auth-heading">Welcome back.</h1>
        <p class="auth-subheading">Log in to continue your training.</p>

        <!-- Global Alert Banner -->
        <div id="loginError" class="auth-alert-banner">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span id="loginErrorText">Invalid email or password</span>
        </div>

        <!-- Success Banner -->
        <div id="loginSuccess" class="auth-alert-banner" style="display:none; background: rgba(198,255,61,0.1); border-color: rgba(198,255,61,0.3); color: #C6FF3D;">
          <i class="bi bi-check-circle-fill"></i>
          <span id="loginSuccessText">Success!</span>
        </div>

        <form id="loginForm" novalidate>
          <!-- Email Field -->
          <div class="form-group-custom">
            <label for="loginEmail" class="form-label-custom">Email address</label>
            <div class="input-icon-wrap">
              <i class="bi bi-envelope-fill input-leading-icon"></i>
              <input type="email" id="loginEmail" class="form-input-custom" placeholder="Email address" required autocomplete="email">
            </div>
            <div class="form-field-error" id="emailError"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group-custom">
            <label for="loginPassword" class="form-label-custom">Password</label>
            <div class="input-icon-wrap">
              <i class="bi bi-lock-fill input-leading-icon"></i>
              <input type="password" id="loginPassword" class="form-input-custom" placeholder="Password" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" data-target="loginPassword" aria-label="Show password">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
            <div class="form-field-error" id="passwordError"></div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <label class="custom-checkbox-row">
              <input type="checkbox" id="rememberMe">
              <span class="custom-checkbox-box"><i class="bi bi-check-lg"></i></span>
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="text-muted small hover-lime">Forgot password?</a>
          </div>

          <!-- Submit CTA -->
          <button type="submit" class="btn-fitnexa btn-accent w-100 py-3 mb-3" id="loginBtn">
            Log In <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <!-- Social Divider -->
        <div class="auth-divider-line">or continue with</div>

        <!-- Social Buttons -->
        <div class="social-btns-grid">
          <button type="button" class="btn-social-outline" id="btnGoogleLogin">
            <i class="bi bi-google"></i> Continue with Google
          </button>
          <button type="button" class="btn-social-outline" id="btnAppleLogin">
            <i class="bi bi-apple"></i> Continue with Apple
          </button>
        </div>

        <!-- Signup Prompt Link -->
        <div class="text-center mt-4 small text-secondary">
          Don't have an account? <a href="signup.html" class="text-lime fw-bold">Sign up</a>
        </div>
      </div>
    </div>

    <!-- ==========================================================================
         RIGHT VISUAL PANEL
         ========================================================================== -->
    <div class="auth-visual-column d-none d-lg-flex">
      <img src="assets/images/workout-muscle.jpg" alt="FITNEXA Athlete Training" class="auth-visual-bg">
      <div class="auth-visual-overlay"></div>

      <div class="auth-visual-content">
        <!-- Brand Quote -->
        <div class="auth-quote-text">
          "Discipline today<br><span class="auth-quote-accent">A stronger tomorrow.</span>"
        </div>

        <!-- Bottom Taglines -->
        <div class="auth-footer-taglines mt-2">
          <span>AI PLANS</span>
          <span>•</span>
          <span>REAL COACHES</span>
          <span>•</span>
          <span>REAL RESULTS</span>
        </div>
      </div>
    </div>
  </div>

  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Supabase Config -->
  <script src="assets/js/supabase-config.js"></script>
  <!-- Auth Logic (Supabase Edition) -->
  <script src="assets/js/auth.js"></script>
  <!-- Presentation & Animation Layer -->
  <script src="assets/js/auth-ui.js"></script>
  <script src="assets/js/animations/auth.js"></script>

  <!-- Login Form Handler (Using Supabase Auth) -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already logged in — redirect to dashboard
      if (window.Auth) {
        const session = await window.Auth.initSession();
        if (session) {
          window.location.href = 'dashboard/index.html';
          return;
        }
      }

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('loginEmail');
      const passInput = document.getElementById('loginPassword');
      const loginBtn = document.getElementById('loginBtn');
      const errorBanner = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');
      const successBanner = document.getElementById('loginSuccess');
      const successText = document.getElementById('loginSuccessText');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.style.display = 'none';
        successBanner.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passInput.value.trim();

        if (!email) {
          if (window.triggerErrorShake) window.triggerErrorShake(emailInput);
          document.getElementById('emailError').innerText = 'Please enter your email address.';
          return;
        } else {
          document.getElementById('emailError').innerText = '';
        }

        if (!password) {
          if (window.triggerErrorShake) window.triggerErrorShake(passInput);
          document.getElementById('passwordError').innerText = 'Please enter your password.';
          return;
        } else {
          document.getElementById('passwordError').innerText = '';
        }

        if (window.setButtonLoading) window.setButtonLoading(loginBtn, 'Authenticating...');

        try {
          const res = await window.Auth.login(email, password);
          if (res && res.success) {
            successBanner.style.display = 'flex';
            successText.innerText = 'Login successful! Redirecting...';
            setTimeout(() => {
              window.location.href = 'dashboard/index.html';
            }, 500);
          } else {
            if (window.resetButtonLoading) window.resetButtonLoading(loginBtn);
            errorBanner.style.display = 'flex';
            errorText.innerText = res ? res.message : 'Invalid credentials. Please try again.';
            if (window.triggerErrorShake) window.triggerErrorShake(form);
          }
        } catch (err) {
          if (window.resetButtonLoading) window.resetButtonLoading(loginBtn);
          errorBanner.style.display = 'flex';
          errorText.innerText = 'Network error. Please check your connection.';
          if (window.triggerErrorShake) window.triggerErrorShake(form);
        }
      });

      // Google Login
      const btnGoogle = document.getElementById('btnGoogleLogin');
      if (btnGoogle) {
        btnGoogle.addEventListener('click', async () => {
          if (window.Auth && window.Auth.loginWithGoogle) {
            await window.Auth.loginWithGoogle();
          }
        });
      }

      // Apple Login
      const btnApple = document.getElementById('btnAppleLogin');
      if (btnApple) {
        btnApple.addEventListener('click', async () => {
          if (window.Auth && window.Auth.loginWithApple) {
            await window.Auth.loginWithApple();
          }
        });
      }
    });
  </script>
</body>
</html>
