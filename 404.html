<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found — FITNEXA AI</title>
    <meta name="theme-color" content="#02050A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .error-page-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at 50% 40%, rgba(0, 102, 255, 0.12) 0%, #02050a 70%);
        }
        .error-glitch-code {
            font-family: var(--font-heading);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(180deg, #fff 30%, rgba(0, 212, 255, 0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="error-page-wrap">
        <div class="container" style="max-width:600px;">
            <a href="index.html" class="nav-logo mb-4 d-inline-block" style="font-size:1.5rem;">FITNEXA <span>AI</span></a>
            
            <div class="error-glitch-code">404</div>
            <div class="text-label mb-3" style="color:var(--blue-accent);letter-spacing:0.15em;">NODE DISCONNECTED</div>
            <h1 class="heading-md mb-3">TRAINING VECTOR NOT FOUND</h1>
            <p class="text-muted mb-5" style="font-size:0.95rem;line-height:1.6;">The fitness module or page you requested could not be located in the current training schema. It may have been relocated or updated.</p>

            <div class="d-flex flex-wrap gap-3 justify-content-center">
                <a href="index.html" class="btn-outline-glow px-4 py-3" style="border-radius:10px;font-size:0.85rem;font-weight:700;">RETURN TO HOME</a>
                <a href="dashboard.html" class="btn-primary-glow px-4 py-3" style="border-radius:10px;font-size:0.85rem;font-weight:700;">ENTER DASHBOARD</a>
            </div>
        </div>
    </div>
</body>
</html>
