<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — FITNEXA AI</title>
    <meta name="description" content="Create your FITNEXA AI account. Start your AI-powered fitness journey today.">
    <meta name="theme-color" content="#02050A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body" style="cursor:auto;">
    <div class="auth-page">
        <!-- Left: Branding with 3D AI Core -->
        <div class="auth-branding d-none d-lg-flex depth-container">
            <div class="auth-brand-bg">
                <img src="images/cta-athlete.webp" alt="Athlete" loading="eager">
                <div class="auth-brand-overlay"></div>
            </div>
            <div class="depth-atmospheric"></div>
            <div class="depth-3d-canvas" id="signupAICoreCanvas" style="opacity:0.85;"></div>
            <div class="auth-brand-content depth-typography">
                <a href="index.html" class="auth-logo">FITNEXA <span>AI</span></a>
                <h1 class="auth-brand-headline">BECOME<br><span>STRONGER.</span></h1>
                <p class="auth-brand-sub">Join thousands of athletes training smarter with AI-powered coaching.</p>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-container sparta-spec-panel hud-corner-bracket p-4 p-md-5">
                <a href="index.html" class="auth-logo d-lg-none mb-4 d-block">FITNEXA <span>AI</span></a>
                <div class="spec-badge-gold mb-2" style="width:fit-content;font-size:0.68rem;"><i class="bi bi-person-plus-fill me-1"></i> ATHLETE ENROLLMENT</div>
                <h2 class="auth-title mt-2">Create Your Account</h2>
                <p class="auth-subtitle">Start your AI-powered fitness evolution.</p>

                <div id="signupError" class="auth-error" style="display:none;"></div>

                <form id="signupForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="signupName" class="form-label-custom">Full Name</label>
                        <input type="text" id="signupName" class="form-input-custom" placeholder="John Doe" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="signupEmail" class="form-label-custom">Email Address</label>
                        <input type="email" id="signupEmail" class="form-input-custom" placeholder="you@email.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="signupPassword" class="form-label-custom">Password</label>
                        <input type="password" id="signupPassword" class="form-input-custom" placeholder="At least 6 characters" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="signupConfirm" class="form-label-custom">Confirm Password</label>
                        <input type="password" id="signupConfirm" class="form-input-custom" placeholder="Re-enter password" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-gold-glow w-100 mt-2" id="signupBtn">
                        CREATE ACCOUNT <span class="btn-arrow"><i class="bi bi-arrow-right"></i></span>
                    </button>
                </form>

                <p class="auth-footer-text mt-4">
                    Already have an account? <a href="login.html" class="auth-link">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/data-store.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/three-core.js"></script>
    <script src="js/motion-fx.js"></script>
    <script src="js/app-motion.js"></script>
    <script>
    (function() {
        'use strict';
        if (window.Auth && window.Auth.redirectIfAuth('dashboard.html')) return;

        const form = document.getElementById('signupForm');
        const errorBox = document.getElementById('signupError');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorBox.style.display = 'none';

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;

            if (!name || !email || !password || !confirm) {
                errorBox.textContent = 'Please fill in all fields.';
                errorBox.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorBox.textContent = 'Password must be at least 6 characters.';
                errorBox.style.display = 'block';
                return;
            }

            const result = window.Auth.signup(name, email, password);
            if (result.success) {
                window.location.href = 'onboarding.html';
            } else {
                errorBox.textContent = result.message;
                errorBox.style.display = 'block';
            }
        });

        // Initialize 3D AI Core in left branding
        if (window.Fitnexa3D) {
            window.signupAICore = window.Fitnexa3D.createAICore('#signupAICoreCanvas', {
                size: 420,
                sphereRadius: 1.35,
                particlesCount: 85,
                cameraDistance: 5.0
            });

            // React to input focus
            document.querySelectorAll('.form-input-custom').forEach(input => {
                input.addEventListener('focus', function() {
                    if (window.signupAICore) {
                        window.signupAICore.pulse(0.6);
                        window.signupAICore.setIntensity(1.6);
                        if (window.signupAICore.setState) window.signupAICore.setState('LISTENING');
                    }
                });
                input.addEventListener('blur', function() {
                    if (window.signupAICore) {
                        window.signupAICore.setIntensity(1.0);
                        if (window.signupAICore.setState) window.signupAICore.setState('IDLE');
                    }
                });
            });
        }
    })();
    </script>
</body>
</html>
