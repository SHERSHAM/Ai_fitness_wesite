<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — FITNEXA AI</title>
  <meta name="description" content="Create your FITNEXA AI athlete account. Start personalized training in under a minute.">
  <meta name="theme-color" content="#0B0C0E">

  <!-- Google Font: Outfit (Weights 300-900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- FITNEXA Stylesheets -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
</head><body>

  <!-- Ambient Light Fields & Subtle Mesh Grid (Matching Landing Page) -->
  <div class="ambient-glow-wrapper">
    <div class="ambient-glow-lime"></div>
    <div class="ambient-glow-violet"></div>
  </div>
  <div class="tech-grid-bg"></div>

  <div class="auth-split-wrapper position-relative z-1">
    <!-- ==========================================================================
         LEFT FORM PANEL
         ========================================================================== -->
    <div class="auth-form-column">
      <!-- Brand Logo Header -->
      <a href="index.html" class="nav-brand-logo mb-4 text-decoration-none">
        FITNEXA
        <span class="nav-brand-dot"></span>
      </a>

      <!-- Form Container -->
      <div class="auth-form-container">
        <h1 class="auth-heading">Start training smarter.</h1>
        <p class="auth-subheading">Your AI coach is ready in under a minute.</p>

        <!-- Global Alert Banner -->
        <div id="signupError" class="auth-alert-banner">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span id="signupErrorText">Please fill in all required fields</span>
        </div>

        <!-- Success Banner -->
        <div id="signupSuccess" class="auth-alert-banner" style="display:none; background: rgba(198,255,61,0.1); border-color: rgba(198,255,61,0.3); color: #C6FF3D;">
          <i class="bi bi-check-circle-fill"></i>
          <span id="signupSuccessText">Account created!</span>
        </div>

        <form id="signupForm" novalidate>
          <!-- Full Name Field -->
          <div class="form-group-custom">
            <label for="signupName" class="form-label-custom">Full Name</label>
            <div class="input-icon-wrap">
              <i class="bi bi-person-fill input-leading-icon"></i>
              <input type="text" id="signupName" class="form-input-custom" placeholder="Marcus Kane" required autocomplete="name">
            </div>
            <div class="form-field-error" id="nameError"></div>
          </div>

          <!-- Email Field -->
          <div class="form-group-custom">
            <label for="signupEmail" class="form-label-custom">Email address</label>
            <div class="input-icon-wrap">
              <i class="bi bi-envelope-fill input-leading-icon"></i>
              <input type="email" id="signupEmail" class="form-input-custom" placeholder="name@example.com" required autocomplete="email">
            </div>
            <div class="form-field-error" id="emailError"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group-custom">
            <label for="signupPassword" class="form-label-custom">Password</label>
            <div class="input-icon-wrap">
              <i class="bi bi-lock-fill input-leading-icon"></i>
              <input type="password" id="signupPassword" class="form-input-custom" placeholder="Create a password" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-target="signupPassword" aria-label="Show password">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
            <!-- Live Password Strength Meter (4 Segments) -->
            <div class="password-strength-wrap">
              <div class="strength-meter-label">
                <span>Password strength: <strong id="strengthLabel" class="text-white">None</strong></span>
              </div>
              <div class="strength-segments-row">
                <div class="strength-segment" id="sSeg1"></div>
                <div class="strength-segment" id="sSeg2"></div>
                <div class="strength-segment" id="sSeg3"></div>
                <div class="strength-segment" id="sSeg4"></div>
              </div>
            </div>
            <div class="form-field-error" id="passwordError"></div>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group-custom">
            <label for="signupConfirmPassword" class="form-label-custom">Confirm password</label>
            <div class="input-icon-wrap">
              <i class="bi bi-shield-lock-fill input-leading-icon"></i>
              <input type="password" id="signupConfirmPassword" class="form-input-custom" placeholder="Confirm password" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-target="signupConfirmPassword" aria-label="Show password">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
            <div class="form-field-error" id="confirmError"></div>
          </div>

          <!-- Terms Checkbox -->
          <div class="mb-4">
            <label class="custom-checkbox-row">
              <input type="checkbox" id="termsCheckbox" checked>
              <span class="custom-checkbox-box"><i class="bi bi-check-lg"></i></span>
              <span>I agree to the <a href="#" class="text-lime text-decoration-none">Terms & Privacy Policy</a></span>
            </label>
          </div>

          <!-- Submit CTA -->
          <button type="submit" class="btn-matte-glass btn-matte-lime w-100 mb-3" id="signupBtn">
            Create Account
          </button>
        </form>

        <!-- Social Divider -->
        <div class="auth-divider-line">or continue with</div>

        <!-- Social Buttons -->
        <div class="social-btns-grid">
          <button type="button" class="btn-matte-glass btn-matte-dark" id="btnGoogleSignup">
            Continue with Google
          </button>
          <button type="button" class="btn-matte-glass btn-matte-dark" id="btnAppleSignup">
            Continue with Apple
          </button>
        </div>v>

        <!-- Login Prompt Link -->
        <div class="text-center mt-4 small text-secondary">
          Already have an account? <a href="login.html" class="text-lime fw-bold">Log in</a>
        </div>
      </div>
    </div>

    <!-- ==========================================================================
         RIGHT VISUAL PANEL
         ========================================================================== -->
    <div class="auth-visual-column d-none d-lg-flex">
      <img src="assets/images/signup-athlete.jpg" alt="Athletic Excellence" class="auth-visual-bg">
      <div class="auth-visual-overlay"></div>

      <div class="auth-visual-content">
        <!-- Brand Quote -->
        <div class="auth-quote-text">
          Stronger<br>Fitter<br>Happier<br><span class="auth-quote-accent">With AI.</span>
        </div>

        <!-- Bottom Taglines -->
        <div class="auth-footer-taglines mt-2">
          <span>YOUR GOALS</span>
          <span>•</span>
          <span>OUR AI</span>
          <span>•</span>
          <span>A STRONGER YOU</span>
        </div>
      </div>
    </div>
  </div>

  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Supabase Config -->
  <script src="assets/js/supabase-config.js"></script>
  <!-- Auth Logic (Supabase Edition) -->
  <script src="assets/js/auth.js"></script>
  <!-- Presentation & Animation Layer -->
  <script src="assets/js/auth-ui.js"></script>
  <script src="assets/js/animations/auth.js"></script>

  <!-- Signup Form Handler (Using Supabase Auth) -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already logged in
      if (window.Auth) {
        const session = await window.Auth.initSession();
        if (session) {
          window.location.href = 'dashboard/index.html';
          return;
        }
      }

      const form = document.getElementById('signupForm');
      const nameInput = document.getElementById('signupName');
      const emailInput = document.getElementById('signupEmail');
      const passInput = document.getElementById('signupPassword');
      const confirmInput = document.getElementById('signupConfirmPassword');
      const signupBtn = document.getElementById('signupBtn');
      const errorBanner = document.getElementById('signupError');
      const errorText = document.getElementById('signupErrorText');
      const successBanner = document.getElementById('signupSuccess');
      const successText = document.getElementById('signupSuccessText');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.style.display = 'none';
        successBanner.style.display = 'none';

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passInput.value.trim();
        const confirmPass = confirmInput.value.trim();

        if (!name) {
          if (window.triggerErrorShake) window.triggerErrorShake(nameInput);
          document.getElementById('nameError').innerText = 'Please enter your full name.';
          return;
        } else {
          document.getElementById('nameError').innerText = '';
        }

        if (!email || !email.includes('@')) {
          if (window.triggerErrorShake) window.triggerErrorShake(emailInput);
          document.getElementById('emailError').innerText = 'Please enter a valid email address.';
          return;
        } else {
          document.getElementById('emailError').innerText = '';
        }

        if (!password || password.length < 6) {
          if (window.triggerErrorShake) window.triggerErrorShake(passInput);
          document.getElementById('passwordError').innerText = 'Password must be at least 6 characters.';
          return;
        } else {
          document.getElementById('passwordError').innerText = '';
        }

        if (password !== confirmPass) {
          if (window.triggerErrorShake) window.triggerErrorShake(confirmInput);
          document.getElementById('confirmError').innerText = 'Passwords do not match.';
          return;
        } else {
          document.getElementById('confirmError').innerText = '';
        }

        if (window.setButtonLoading) window.setButtonLoading(signupBtn, 'Creating Account...');

        try {
          const res = await window.Auth.signup(name, email, password);
          if (res && res.success) {
            // Check if email confirmation is required
            if (res.user && !res.session) {
              // Email confirmation required
              successBanner.style.display = 'flex';
              successText.innerText = 'Account created! Please check your email to confirm your account, then log in.';
              if (window.resetButtonLoading) window.resetButtonLoading(signupBtn);
            } else {
              // Auto-confirmed, redirect to onboarding
              successBanner.style.display = 'flex';
              successText.innerText = 'Account created! Redirecting...';
              setTimeout(() => {
                window.location.href = 'onboarding.html';
              }, 500);
            }
          } else {
            if (window.resetButtonLoading) window.resetButtonLoading(signupBtn);
            errorBanner.style.display = 'flex';
            errorText.innerText = res ? res.message : 'Registration error. Try a different email.';
            if (window.triggerErrorShake) window.triggerErrorShake(form);
          }
        } catch (err) {
          if (window.resetButtonLoading) window.resetButtonLoading(signupBtn);
          errorBanner.style.display = 'flex';
          errorText.innerText = 'Network error. Please check your connection.';
          if (window.triggerErrorShake) window.triggerErrorShake(form);
        }
      });

      // Google Signup
      const btnGoogle = document.getElementById('btnGoogleSignup');
      if (btnGoogle) {
        btnGoogle.addEventListener('click', async () => {
          if (window.Auth && window.Auth.loginWithGoogle) {
            await window.Auth.loginWithGoogle();
          }
        });
      }

      // Apple Signup
      const btnApple = document.getElementById('btnAppleSignup');
      if (btnApple) {
        btnApple.addEventListener('click', async () => {
          if (window.Auth && window.Auth.loginWithApple) {
            await window.Auth.loginWithApple();
          }
        });
      }
    });
  </script>
</body>
</html>
