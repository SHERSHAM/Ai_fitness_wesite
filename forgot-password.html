<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — FITNEXA AI</title>
  <meta name="description" content="Reset your FITNEXA account password.">
  <meta name="theme-color" content="#0B0C0E">

  <!-- Google Fonts: Outfit, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- FITNEXA Stylesheets -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">

  <style>
    .forgot-pwd-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      overflow: hidden;
      background: #0B0C0E;
    }
    .forgot-pwd-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.4) contrast(1.2);
    }
    .forgot-pwd-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      background: rgba(18, 20, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      padding: 42px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(198, 255, 61, 0.1);
    }
    .mountain-quote-badge {
      position: absolute;
      bottom: 40px;
      right: 48px;
      z-index: 5;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      line-height: 1.15;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      text-align: right;
      pointer-events: none;
    }
    /* Animated Checkmark for confirmation */
    .success-svg-check {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: block;
    }
    .success-circle {
      stroke: var(--accent-lime);
      stroke-width: 3;
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      animation: strokeCircle 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    .success-check {
      stroke: var(--accent-lime);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: strokeCheck 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.5s forwards;
    }
    @keyframes strokeCircle { 100% { stroke-dashoffset: 0; } }
    @keyframes strokeCheck { 100% { stroke-dashoffset: 0; } }
  </style>
</head>
<body>

  <div class="forgot-pwd-hero">
    <img src="assets/images/mountain-athlete.jpg" alt="Mountain Athlete" class="forgot-pwd-bg">

    <div class="forgot-pwd-card" id="forgotCard">
      <!-- Brand Logo Header -->
      <div class="text-center mb-4">
        <a href="index.html" class="d-inline-flex flex-column align-items-center text-decoration-none">
          <div class="auth-brand-title">FITNEXA<span class="text-lime">.</span></div>
          <div class="auth-brand-tagline">Train Smarter. Be Stronger.</div>
        </a>
      </div>

      <div id="resetFormContainer">
        <h2 class="auth-heading fs-3 text-center">Reset your password</h2>
        <p class="auth-subheading text-center mb-4">
          Enter your email address and we'll send you a link to reset your password.
        </p>

        <form id="forgotForm" novalidate>
          <div class="form-group-custom">
            <div class="input-icon-wrap">
              <i class="bi bi-envelope-fill input-leading-icon"></i>
              <input type="email" id="resetEmail" class="form-input-custom" placeholder="Email address" required autocomplete="email">
            </div>
            <div class="form-field-error text-center" id="resetEmailError"></div>
          </div>

          <button type="submit" class="btn-fitnexa btn-accent w-100 py-3 mb-3" id="resetBtn">
            Send Reset Link <i class="bi bi-arrow-right"></i>
          </button>
        </form>
      </div>

      <!-- Confirmation State (Hidden until submitted) -->
      <div id="resetSuccessContainer" style="display: none;" class="text-center py-3">
        <svg class="success-svg-check" viewBox="0 0 52 52">
          <circle class="success-circle" cx="26" cy="26" r="24" fill="none"/>
          <path class="success-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <h3 class="auth-heading fs-4 mb-2">Check your inbox</h3>
        <p class="text-secondary small mb-4">
          We've sent password reset instructions to <span class="text-white fw-bold" id="sentEmailTarget"></span>.
        </p>
      </div>

      <div class="text-center mt-3">
        <a href="login.html" class="text-secondary small hover-lime d-inline-flex align-items-center gap-2">
          <i class="bi bi-arrow-left"></i> Back to login
        </a>
      </div>
    </div>

    <!-- Mountain Athlete Inspirational Slogan -->
    <div class="mountain-quote-badge d-none d-md-block">
      GOOD<br>THINGS<br>TAKE TIME.
    </div>
  </div>

  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <!-- Presentation & Animation Layer -->
  <script src="assets/js/animations/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgotForm');
      const emailInput = document.getElementById('resetEmail');
      const resetBtn = document.getElementById('resetBtn');
      const formContainer = document.getElementById('resetFormContainer');
      const successContainer = document.getElementById('resetSuccessContainer');
      const sentEmailTarget = document.getElementById('sentEmailTarget');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();

        if (!email || !email.includes('@')) {
          if (window.triggerErrorShake) window.triggerErrorShake(emailInput);
          document.getElementById('resetEmailError').innerText = 'Please enter a valid email address.';
          return;
        }

        if (window.setButtonLoading) window.setButtonLoading(resetBtn, 'Sending...');

        try {
          const res = await window.Auth.resetPassword(email);
          formContainer.style.display = 'none';
          sentEmailTarget.innerText = email;
          successContainer.style.display = 'block';

          if (typeof gsap !== 'undefined') {
            gsap.fromTo(successContainer, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5 });
          }
        } catch (err) {
          if (window.resetButtonLoading) window.resetButtonLoading(resetBtn);
          document.getElementById('resetEmailError').innerText = 'Error sending reset email. Please try again.';
        }
      });
    });
  </script>
</body>
</html>
