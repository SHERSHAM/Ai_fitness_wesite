<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — FITNEXA AI</title>
    <meta name="description" content="Reset your FITNEXA AI password.">
    <meta name="theme-color" content="#02050A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body" style="cursor:auto;">
    <div class="auth-page auth-page-centered">
        <div class="auth-form-container" style="max-width:440px;">
            <a href="index.html" class="auth-logo mb-4 d-block">FITNEXA <span>AI</span></a>
            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <div id="resetMsg" class="auth-success" style="display:none;">
                <i class="bi bi-check-circle-fill me-2"></i> Password reset link sent! Check your email inbox.
            </div>
            <div id="resetError" class="auth-error" style="display:none;"></div>

            <form id="resetForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="resetEmail" class="form-label-custom">Email Address</label>
                    <input type="email" id="resetEmail" class="form-input-custom" placeholder="you@email.com" required autocomplete="email">
                </div>
                <button type="submit" class="btn-primary-glow w-100" id="resetBtn">
                    SEND RESET LINK <span class="btn-arrow"><i class="bi bi-arrow-right"></i></span>
                </button>
            </form>

            <p class="auth-footer-text">
                <a href="login.html" class="auth-link"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </p>
        </div>
    </div>

    <script>
    (function() {
        'use strict';
        const form = document.getElementById('resetForm');
        const msg = document.getElementById('resetMsg');
        const errorBox = document.getElementById('resetError');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorBox.style.display = 'none';
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) {
                errorBox.textContent = 'Please enter your email address.';
                errorBox.style.display = 'block';
                return;
            }
            // Simulated — in production, this would call a backend API
            form.style.display = 'none';
            msg.style.display = 'block';
        });
    })();
    </script>
</body>
</html>
