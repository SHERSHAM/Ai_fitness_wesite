<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FITNEXA — AI Fitness Trainer Web Portal</title>
  <meta name="description" content="Cinematic AI-Powered Personal Fitness Platform. Experience real-time form correction, adaptive programming, and biometric readiness tracking.">
  <meta name="theme-color" content="#0B0C0E">

  <!-- Google Font: Outfit (Weights 300-900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- FITNEXA Master Stylesheets -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css?v=20261007_v5">
  <link rel="stylesheet" href="assets/css/pages/home.css?v=20261007_v7">
</head>
<body>

  <!-- Ambient Light Fields & Subtle Mesh Grid -->
  <div class="ambient-glow-wrapper">
    <div class="ambient-glow-lime"></div>
    <div class="ambient-glow-violet"></div>
  </div>
  <div class="tech-grid-bg"></div>

  <!-- ==========================================================================
       1. PRELOADER
       ========================================================================== -->
  <div class="fitnexa-preloader" id="fitnexaPreloader">
    <div class="preloader-brand">
      FITNEXA<span>.</span>
    </div>
    <div class="preloader-bar-track">
      <div class="preloader-bar-fill" id="preloaderFill"></div>
    </div>
  </div>
  <script>
    // Failsafe: ensure preloader dismisses even if assets/scripts stall
    setTimeout(function() {
      var p = document.getElementById('fitnexaPreloader');
      if (p && !p.classList.contains('loaded')) {
        p.classList.add('loaded');
      }
    }, 1000);
  </script>

  <!-- ==========================================================================
       2. STICKY FROSTED GLASS NAVBAR
       ========================================================================== -->
  <nav class="fitnexa-nav" id="fitnexaNav">
    <div class="container-fluid px-4 px-lg-5">
      <div class="d-flex justify-content-between align-items-center">
        <!-- Brand Logo -->
        <a href="index.html" class="nav-brand-logo">
          FITNEXA
          <span class="nav-brand-dot"></span>
        </a>



      </div>
    </div>
  </nav>

  <!-- ==========================================================================
       3. HERO SECTION (Matching Reference Image)
       ========================================================================== -->
  <section class="hero-section" id="heroSection">
    <!-- Full-Bleed Cinematic Athlete Background -->
    <div class="hero-backdrop-container">
      <img src="assets/images/hero-bg-athlete.jpg" alt="FITNEXA Athlete" class="hero-bg-img">
      <div class="hero-backdrop-overlay"></div>
    </div>

    <div class="container-fluid px-4 px-lg-5 position-relative z-3">
      <div class="row align-items-center">

        <!-- Left Column: Copy, CTAs, and Stats -->
        <div class="col-lg-7 col-xl-6">


          <!-- Bold Headline with Word Reveal -->
          <h1 class="hero-title">
            <span class="d-block title-line">PERSONALIZED</span>
            <span class="d-block title-line">FITNESS. <span class="text-lime">REAL RESULTS.</span></span>
          </h1>

          <!-- Subtitle Copy -->
          <p class="hero-description">
            Get a training plan that adapts to you. Track progress, stay consistent, and reach your goals with AI.
          </p>

          <!-- Action Buttons -->
          <div class="hero-cta-group">
            <a href="signup.html" class="btn-matte-glass btn-matte-lime">
              Get Started
            </a>
            <a href="login.html" class="btn-matte-glass btn-matte-dark">
              Sign In
            </a>
          </div>

        </div>

      </div>
    </div>
  </section>

  <!-- ==========================================================================
       SCRIPTS (Three.js, GSAP, Bootstrap)
       ========================================================================== -->
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- FITNEXA Hero Animations -->
  <script src="assets/js/animations/hero.js?v=3"></script>
</body>
</html>
