<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Details — FITNEXA AI</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#02050A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body">
    <div id="appNavMount"></div>
    <main class="app-main">
        <div class="container-fluid px-3 px-lg-4 py-4">
            <a href="workouts.html" class="back-link mb-3 d-inline-block"><i class="bi bi-arrow-left me-2"></i>Back to Workouts</a>

            <!-- Workout Header -->
            <div class="workout-detail-header mb-4" id="detailHeader">
                <div class="wdh-image" id="detailImage"></div>
                <div class="wdh-info">
                    <div class="wdh-category" id="detailCategory">Strength</div>
                    <h1 class="wdh-title" id="detailTitle">Upper Body Power</h1>
                    <p class="wdh-desc" id="detailDesc">Description loading...</p>
                    <div class="wdh-meta">
                        <div class="wdh-meta-item"><i class="bi bi-clock"></i><span id="detailDuration">45</span> min</div>
                        <div class="wdh-meta-item"><i class="bi bi-speedometer2"></i><span id="detailDifficulty">Intermediate</span></div>
                        <div class="wdh-meta-item"><i class="bi bi-fire"></i><span id="detailCalories">420</span> cal</div>
                        <div class="wdh-meta-item"><i class="bi bi-gear"></i><span id="detailEquipment">Full Gym</span></div>
                    </div>
                    <div class="wdh-targets mt-3" id="detailTargets"></div>
                    <a href="#" class="btn-primary-glow mt-4" id="startDetailBtn" style="padding:14px 36px;">
                        START WORKOUT <span class="btn-arrow"><i class="bi bi-arrow-right"></i></span>
                    </a>
                </div>
            </div>

            <!-- Exercise List -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <span class="text-label" style="color:var(--blue-accent);">EXERCISES</span>
                    <span class="text-label" id="exerciseCount">6 exercises</span>
                </div>
                <div id="exerciseList" class="exercise-list"></div>
            </div>
        </div>
    </main>

    <script src="js/data-store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/motion-fx.js"></script>
    <script src="js/form-analysis.js"></script>
    <script>
    (function() {
        'use strict';
        window.App.init();

        const params = new URLSearchParams(window.location.search);
        const workoutId = params.get('id');
        const workout = window.DataStore.getWorkoutById(workoutId);

        if (!workout) {
            document.querySelector('.app-main').innerHTML = '<div class="text-center py-5"><h2>Workout not found</h2><a href="workouts.html" class="btn-primary-glow mt-3" style="padding:12px 28px;">Back to Library</a></div>';
            return;
        }

        document.title = workout.name + ' — FITNEXA AI';
        document.getElementById('detailImage').innerHTML = '<img src="' + workout.image + '" alt="' + workout.name + '">';
        document.getElementById('detailCategory').textContent = workout.category;
        document.getElementById('detailTitle').textContent = workout.name;
        document.getElementById('detailDesc').textContent = workout.description;
        document.getElementById('detailDuration').textContent = workout.duration;
        document.getElementById('detailDifficulty').textContent = workout.difficulty;
        document.getElementById('detailCalories').textContent = workout.calories;
        document.getElementById('detailEquipment').textContent = workout.equipment;
        document.getElementById('detailTargets').innerHTML = workout.targetMuscles.map(function(m) {
            return '<span class="target-badge">' + m + '</span>';
        }).join('');
        document.getElementById('exerciseCount').textContent = workout.exercises.length + ' exercises';
        document.getElementById('startDetailBtn').href = 'workout-session.html?id=' + workout.id;

        // Initialize Computer Vision AI Form Analysis Overlay
        if (window.FormAnalysis) {
            window.FormAnalysis.init('#detailImage');
        }

        // Render exercises with 3D depth
        const list = document.getElementById('exerciseList');
        list.innerHTML = workout.exercises.map(function(ex, i) {
            return '<div class="exercise-item tilt-card glass-card-3d mb-3">' +
                '<div class="ei-number">' + String(i + 1).padStart(2, '0') + '</div>' +
                '<div class="ei-info">' +
                    '<h4 class="ei-name">' + ex.name + '</h4>' +
                    '<div class="ei-target">' + ex.target + '</div>' +
                    '<p class="ei-instructions">' + ex.instructions + '</p>' +
                    '<div class="ei-tip"><i class="bi bi-stars me-1" style="color:var(--blue-accent);"></i> ' + ex.formCue + '</div>' +
                '</div>' +
                '<div class="ei-stats">' +
                    '<div class="ei-stat"><span class="ei-stat-val">' + ex.sets + '</span><span class="ei-stat-label">Sets</span></div>' +
                    '<div class="ei-stat"><span class="ei-stat-val">' + ex.reps + '</span><span class="ei-stat-label">Reps</span></div>' +
                    '<div class="ei-stat"><span class="ei-stat-val">' + ex.rest + '</span><span class="ei-stat-label">Rest</span></div>' +
                '</div>' +
            '</div>';
        }).join('');

        if (window.MotionFX) window.MotionFX.initTilt();
    })();
    </script>
</body>
</html>
