<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Workout — FITNEXA AI</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#02050A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body">
    <div id="appNavMount"></div>
    <main class="app-main">
        <div class="container-fluid px-3 px-lg-4 py-3">
            <div id="workoutPlayerMount">
                <!-- WorkoutPlayer renders here -->
            </div>
        </div>
    </main>

    <script src="js/data-store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/motion-fx.js"></script>
    <script src="js/workout-player.js"></script>
    <script src="js/app-motion.js"></script>
    <script>
    (function() {
        'use strict';
        window.App.init();
        const user = window.Auth.getCurrentUser();
        if (!user) return;

        const params = new URLSearchParams(window.location.search);
        const workoutId = params.get('id') || user.profile.todayWorkoutId;
        const workout = window.DataStore.getWorkoutById(workoutId);

        if (!workout) {
            document.getElementById('workoutPlayerMount').innerHTML = '<div class="text-center py-5"><h2>Workout not found</h2><a href="workouts.html" class="btn-primary-glow mt-3" style="padding:12px 28px;">Back to Library</a></div>';
            return;
        }

        document.title = workout.name + ' — Active Session';

        new WorkoutPlayer({
            workout: workout,
            user: user,
            container: document.getElementById('workoutPlayerMount')
        });
    })();
    </script>
</body>
</html>
